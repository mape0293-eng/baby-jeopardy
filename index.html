<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Jeopardy🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-cherry: #8E244D;
            --rose-petal: #E57399;
            --gold-accent: #D4AF37;
            --clue-gold: #FFD700;
        }

        body {
            background-color: #fce4ec;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 { font-family: 'Playfair Display', serif; color: var(--deep-cherry); font-size: 50px; margin: 10px 0; text-shadow: 2px 2px white; }

        .jeopardy-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 1250px;
            background-color: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 5px solid var(--sakura-pink);
        }

        .category-header {
            background: var(--deep-cherry);
            color: white;
            height: 90px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 800; font-size: 14px;
            border-radius: 12px; padding: 10px; text-transform: uppercase;
        }

        .clue-card {
            background-color: var(--rose-petal);
            color: white;
            height: 110px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
        }

        .clue-card:hover { transform: scale(1.03); background-color: #f06292; }
        
        .clue-card.visited { 
            background-color: #333333 !important; 
            color: #666666 !important; 
            cursor: default; 
            opacity: 0.6;
        }

        #clue-overlay, #dd-overlay, #winner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
            padding: 5%; box-sizing: border-box; text-align: center;
        }

        #clue-overlay { background-color: var(--deep-cherry); }
        #dd-overlay { background: linear-gradient(45deg, #8E244D, #D4AF37, #E57399); background-size: 400% 400%; animation: gradientBG 3s ease infinite; }
        
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .dd-text { color: white; font-size: 110px; font-weight: 900; text-shadow: 6px 6px #000; margin-bottom: 20px; }

        #clue-text { color: white; font-size: 32px; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; max-width: 900px; }
        #clue-img { max-height: 500px; border: 8px solid white; border-radius: 15px; margin-bottom: 20px; display: none; }
        #answer-text { display: none; color: var(--clue-gold); font-size: 45px; font-weight: 800; border-top: 3px solid var(--clue-gold); padding-top: 20px; margin-bottom: 30px; }

        .overlay-btn { margin: 10px; padding: 15px 40px; font-size: 20px; font-weight: 800; border-radius: 50px; border: none; cursor: pointer; text-transform: uppercase; }
        .correct-btn { background-color: #4CAF50; color: white; }
        .wrong-btn { background-color: #f44336; color: white; }
        .show-ans-btn { background-color: var(--clue-gold); color: var(--deep-cherry); }

        .scoreboard { display: flex; gap: 40px; margin-top: 20px; }
        .score-pill { background: white; padding: 15px 30px; border-radius: 15px; border: 4px solid var(--sakura-pink); font-size: 24px; font-weight: 800; color: var(--deep-cherry); }
        
        .team-toggle { margin-bottom: 15px; background: white; padding: 10px; border-radius: 10px; border: 2px solid var(--sakura-pink); }
    </style>
</head>
<body>

    <h1>Baby Jeopardy</h1>

    <div class="team-toggle">
        <label style="font-weight: 800; color: var(--deep-cherry);">WHOSE TURN? </label>
        <select id="active-team-select" style="padding: 5px; font-family: 'Montserrat'; font-weight: 600;">
            <option value="mom">TEAM MOM</option>
            <option value="dad">TEAM DAD</option>
        </select>
    </div>

    <div class="jeopardy-board" id="board"></div>

    <div class="scoreboard">
        <div class="score-pill">TEAM MOM: <span id="score-mom">0</span></div>
        <div class="score-pill">TEAM DAD: <span id="score-dad">0</span></div>
    </div>

    <div id="dd-overlay">
        <div class="dd-text">DAILY DOUBLE</div>
        <div style="color: white; font-size: 24px; margin-bottom: 20px;">Wager your points:</div>
        <input type="number" id="wager-input" value="500" style="font-size: 30px; width: 150px; text-align: center; border-radius: 10px; border: none; padding: 10px;">
        <br>
        <button class="overlay-btn show-ans-btn" onclick="proceedToClue(true)">Show Clue</button>
    </div>

    <div id="clue-overlay">
        <div id="active-playing-status" style="color: var(--clue-gold); font-size: 24px; font-weight: 800; margin-bottom: 10px;"></div>
        <img id="clue-img" src="" alt="Clue Image">
        <div id="clue-text">CLUE</div>
        <div id="answer-text">ANSWER</div>
        
        <div id="pre-answer-controls">
            <button class="overlay-btn show-ans-btn" onclick="showAnswer()">Show Answer</button>
        </div>

        <div id="post-answer-controls" style="display: none;">
            <button class="overlay-btn correct-btn" onclick="resolveClue(true)">CORRECT (+)</button>
            <button class="overlay-btn wrong-btn" onclick="resolveClue(false)">WRONG (-)</button>
        </div>
    </div>

    <script>
        let currentClue = null;
        let currentWager = 0;
        let scores = { mom: 0, dad: 0 };

        const gameData = [
            {
                category: "90s Desi Kids TV",
                clues: [
                    { v: 100, q: "This magical fairy appeared to help a young girl named Fruity in solving problems.", a: "Who is Son Pari?" },
                    { v: 200, q: "In this show, a boy named Sanju finds a magical pencil that brings drawings to life.", a: "Who is Shaka Laka Boom Boom?" },
                    { v: 300, q: "This show followed students in a boarding school, exploring friendship and mischief.", a: "Who is Hip Hip Hurray?" },
                    { v: 400, q: "This series featured a young boy superhero solving crimes using his intelligence and a magical ring.", a: "Who is Junior G?", isDD: true },
                    { v: 500, q: "Starring Milind Soman, this sci-fi show followed a space warrior and his crew in the year 2123.", a: "Who is Captain Vyom?" }
                ]
            },
            {
                category: "Baby Anatomy",
                clues: [
                    { v: 100, q: "The soft spot on a baby's head.", a: "What is a fontanelle?" },
                    { v: 200, q: "Babies are born without this bone in their legs.", a: "What are kneecaps?" },
                    { v: 300, q: "A baby's first hair that covers their body in the womb.", a: "What is lanugo?" },
                    { v: 400, q: "A newborn is born with approximately this many bones before they fuse together.", a: "What is 300?" },
                    { v: 500, q: "This is the only body part a baby is born with that is already almost at its full adult size.", a: "What are the Eyes?" }
                ]
            },
            {
                category: "Baby Animals",
                clues: [
                    { v: 100, q: "This is the general name for a baby marsupial, most famously used for kangaroos.", a: "What is a Joey?" },
                    { v: 200, q: "Often seen with fluffy feathers and big eyes, a baby owl is called this.", a: "What is an Owlet?" },
                    { v: 300, q: "Elegant and white in adulthood, a baby swan is known as this.", a: "What is a Cygnet?" },
                    { v: 400, q: "This is the specific name for a baby platypus.", a: "What is a Puggle?" },
                    { v: 500, q: "Known for their armor-like scales, this is the only mammal in the world to be covered in hard scales.", a: "What is a Pangolin?" }
                ]
            },
            {
                category: "Cartoon Babies",
                clues: [
                    { v: 100, q: "", img: "image_100.jpg", a: "Who is Maggie Simpson?" },
                    { v: 200, q: "", img: "image_200.jpg", a: "Who is Jack-Jack?" },
                    { v: 300, q: "", img: "image_300.jpg", a: "Who is Baby Tarzan?" },
                    { v: 400, q: "", img: "image_400.jpg", a: "Who are Bamm-Bamm and Pebbles?" },
                    { v: 500, q: "", img: "image_500.jpg", a: "Who is Tommy Pickles?", isDD: true }
                ]
            },
            {
                category: "Pop Culture",
                clues: [
                    { v: 100, q: "The YouTube song that became the first video to reach 10 billion views.", a: "What is 'Baby Shark'?" },
                    { v: 200, q: "This 90s Bollywood classic features a silent Sardarji child who says: 'Tussi ja rahe ho? Tussi na jao!'", a: "What is Kuch Kuch Hota Hai?" },
                    { v: 300, q: "The 1987 film where three bachelors are left in charge of an infant.", a: "What is 'Three Men and a Baby'?" },
                    { v: 400, q: "In the 90s classic 'Baby's Day Out', this is the city where the baby outmaneuvers three kidnappers.", a: "What is Chicago?" },
                    { v: 500, q: "This 90s health drink ad featured children who grew up to be stars Shahid Kapoor and Ayesha Takia.", a: "What is Complan?" }
                ]
            }
        ];

        function initBoard() {
            const board = document.getElementById('board');
            gameData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = cat.category;
                board.appendChild(header);
            });
            for (let i = 0; i < 5; i++) {
                gameData.forEach(cat => {
                    const clue = cat.clues[i];
                    const card = document.createElement('div');
                    card.className = 'clue-card';
                    card.innerText = clue.v;
                    card.onclick = () => handleClueClick(card, clue);
                    board.appendChild(card);
                });
            }
        }

        function handleClueClick(card, clue) {
            if (card.classList.contains('visited')) return;
            card.classList.add('visited');
            currentClue = clue;
            currentWager = clue.v;

            if (clue.isDD) {
                document.getElementById('dd-overlay').style.display = 'flex';
                document.getElementById('wager-input').value = clue.v;
            } else {
                proceedToClue(false);
            }
        }

        function proceedToClue(isDD) {
            if (isDD) {
                currentWager = parseInt(document.getElementById('wager-input').value) || 0;
                document.getElementById('dd-overlay').style.display = 'none';
            }
            
            const team = document.getElementById('active-team-select').value.toUpperCase();
            document.getElementById('active-playing-status').innerText = `TEAM ${team} PLAYING FOR ${currentWager} PTS`;
            
            const imgEl = document.getElementById('clue-img');
            if(currentClue.img) {
                imgEl.src = currentClue.img;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('clue-text').innerText = currentClue.q;
            document.getElementById('answer-text').innerText = currentClue.a;
            document.getElementById('answer-text').style.display = 'none';
            document.getElementById('pre-answer-controls').style.display = 'block';
            document.getElementById('post-answer-controls').style.display = 'none';
            document.getElementById('clue-overlay').style.display = 'flex';
        }

        function showAnswer() {
            document.getElementById('answer-text').style.display = 'block';
            document.getElementById('pre-answer-controls').style.display = 'none';
            document.getElementById('post-answer-controls').style.display = 'block';
        }

        function resolveClue(isCorrect) {
            const team = document.getElementById('active-team-select').value;
            const points = isCorrect ? currentWager : -currentWager;
            scores[team] += points;
            document.getElementById(`score-${team}`).innerText = scores[team];
            document.getElementById('clue-overlay').style.display = 'none';
        }

        initBoard();
    </script>
</body>
</html>
